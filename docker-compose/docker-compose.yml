services:
  sergin.hosts-all:
    image: ${DOCKER_REGISTRY-}sergin-host    
    container_name: Sergin.Hosts-All
    build:
      context: ..
      dockerfile: src/Hosts/Sergin.MeterMinder.Hosts.WebApi.All/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    environment:
      # Development applies EF migrations on startup.
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides Sergin:ConnectionStrings:Database (double-underscore = config section separator).
      Sergin__ConnectionStrings__Database: Host=sergin.database;Port=5432;Database=Sergin_DB;Username=postgres;Password=Ww4pC8bzn4
    depends_on:
      sergin.database:
        condition: service_healthy
      sergin.dashboard:
        condition: service_started

  sergin.hosts-webui-all:
    image: ${DOCKER_REGISTRY-}sergin-webui
    container_name: Sergin.Hosts-WebUi-All
    build:
      context: ..
      dockerfile: src/Hosts/Sergin.MeterMinder.Hosts.WebUi.All/Dockerfile
    ports:
      - 5002:8080
      - 5003:8081
    environment:
      # Mandatory here, not merely convenient: AddSerginWebUi throws outside Development
      # because this host has no real authentication (every request runs as Sergin:DevUser).
      # Development also applies EF migrations on startup.
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides Sergin:ConnectionStrings:Database (double-underscore = config section separator).
      Sergin__ConnectionStrings__Database: Host=sergin.database;Port=5432;Database=Sergin_DB;Username=postgres;Password=Ww4pC8bzn4
    depends_on:
      sergin.database:
        condition: service_healthy
      sergin.dashboard:
        condition: service_started

  sergin.database:
    image: postgres:17-alpine
    container_name: Sergin.Database
    environment:
      POSTGRES_PASSWORD: Ww4pC8bzn4
    ports:
      - 5432:5432
    volumes:
      - ./.containers/database/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  sergin.dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.4
    container_name: Sergin.Dashboard
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: true
    ports:
      - 18888:18888
      - 4317:18889